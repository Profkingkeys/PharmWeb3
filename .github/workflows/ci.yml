name: engineering-labs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run eval:ai
      - run: npm run test:production
      - run: npm run eval:ai:production
      - run: npm run demo:ai -- "show me AI projects"
      - run: npm run demo:arbitrage
      - run: npm run demo:arbitrage:backtest
      - run: npm run demo:forex
      - run: npm run demo:forex:backtest
      - run: npm run demo:telemetry
      - run: npm run demo:production:pipeline
      - run: npm run demo:production:trading

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pharmweb3
          MYSQL_USER: pharmweb3
          MYSQL_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - run: mysql -h 127.0.0.1 -u root -proot pharmweb3 < infra/mysql/schema.sql

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/mobile/hybrid-webview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: ./gradlew testDebugUnitTest
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pharmweb3-hybrid-debug-apk
          path: labs/mobile/hybrid-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: labs/mobile/hybrid-webview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: labs/mobile/hybrid-webview
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
